<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TrackIt API</title>
		<style>
			:root { color-scheme: light dark; }
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font: 16px/1.6 system-ui, -apple-system, sans-serif;
			}
			main { max-width: 34rem; padding: 2rem; }
			code { font-size: 0.9em; }
		</style>
	</head>
	<body>
		<main>
			<h1>TrackIt API</h1>
			<p>
				Backend for the TrackIt Android app. Every endpoint lives under
				<code>/api/</code> and requires a valid Firebase ID token in an
				<code>Authorization: Bearer &lt;token&gt;</code> header.
			</p>
			<p>There is no browser-facing UI — see the repository README for the endpoint reference.</p>
		</main>
	</body>
</html>
