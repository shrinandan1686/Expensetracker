name: Release APK

# TrackIt is distributed as a signed APK rather than through the Play Store: it
# needs READ_SMS/RECEIVE_SMS to parse bank messages, and automatic expense
# tracking is not one of Google's approved use cases for those permissions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for a manual run)'
        required: false

permissions:
  contents: write # needed to create the release and upload the APK

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        # Held as a secret rather than committed: it carries the Firebase API key,
        # OAuth client ids and the signing-cert hash.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. An unsigned APK cannot be installed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trackit-release.jks"

      - name: Build release APK
        env:
          TRACKIT_API_BASEURL_RELEASE: ${{ secrets.TRACKIT_API_BASEURL_RELEASE }}
          TRACKIT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TRACKIT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TRACKIT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export TRACKIT_KEYSTORE_PATH="$RUNNER_TEMP/trackit-release.jks"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is actually signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # An unsigned APK installs nowhere, so failing here beats publishing one.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Install by downloading the APK below and allowing installation from
            unknown sources. TrackIt is not on the Play Store because automatic
            SMS-based expense tracking is not an approved use case for the SMS
            permissions it needs.

            Updates must be signed with the same key, so install over the previous
            version rather than uninstalling first if you want to keep your data.

      - name: Clean up secrets from the workspace
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/trackit-release.jks"
